packages:
  - "vendor/*"
  - "packages/*"
  - "examples/vite-app"
  - "examples/nextjs-app"
  - "examples/agentic-a2ui"
  - "examples/tauri-app"
  - "examples/agentic-a2ui-app"
  - "examples/agui-activity-lab"
  - "examples/tauri-universal"
  - "site"
  - "website"
  - "extension"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: false
  sharp: true
  # pnpm 11 fails frozen installs over unlisted build scripts
  # (ERR_PNPM_IGNORED_BUILDS). Both are safe to skip: @swc/core ships
  # platform binaries via optionalDependencies; core-js postinstall is
  # a funding banner.
  "@swc/core": false
  core-js: false
# pnpm 11 no longer reads the `pnpm` field in package.json; overrides live
# here so CI (pinned pnpm) and local pnpm 10 resolve the same config and the
# frozen-lockfile config hash matches on both.
overrides:
  "@changesets/parse>js-yaml": "4.3.2"
  "@lhci/cli>tmp": "0.2.7"
  "@lhci/utils>js-yaml": "3.15.2"
  "cosmiconfig>js-yaml": "4.3.2"
  "js-yaml@4": "4.3.2"
  "external-editor>tmp": "0.2.7"
  "read-yaml-file>js-yaml": "3.15.2"
  fast-uri: "3.1.9"
  shell-quote: "1.12.0"
  joi: "17.13.9"
  postcss: "8.5.25"
  serialize-javascript: "7.1.3"
  sharp: "0.35.5"
  browserslist: "4.28.7"
  svgo: "3.3.5"
  # SVGR 8.1.0 ships no deepmerge import in its runtime bundle.
  "@svgr/plugin-svgo@8.1.0>deepmerge": "-"
  image-size: "2.0.3"
  "undici@7": "7.30.2"
  "undici@8": "8.12.2"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@5": "5.0.12"
  seroval: "1.6.12"
  source-map-js: "1.2.2"
  proxy-addr: "2.0.8"
  compression: "1.8.2"
  "@docusaurus/core>tinypool": "2.1.2"
  devalue: "5.9.3"
  "nanoid@3": "3.3.18"
  follow-redirects: "1.16.3"
  launch-editor: "2.14.2"
  "body-parser@1": "1.20.9"
  "markdown-it@14": "14.3.3"
  dompurify: "3.4.17"
  zod: "4.6.7"
  "get-uri>basic-ftp": "6.2.4"
  "sockjs>uuid": "11.1.1"
  "webpack-dev-server>webpack-dev-middleware": "7.4.6"
  "tsx>esbuild": "0.28.2"
  "@babel/core@7": "7.29.6"
  "colord@2": "2.9.4"
  "ip-address@10": "10.7.4"
  "postcss-selector-parser@6": "6.1.5"
  "postcss-selector-parser@7": "7.1.6"
  "qs@6": "6.16.1"
  "minimatch@>=7 <11": "11.0.8"
  "mermaid>katex": "0.18.2"
