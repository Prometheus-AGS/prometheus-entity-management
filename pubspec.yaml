name: prometheus_entity_management_workspace
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"

workspace:
  - packages/entity_graph_flutter

dev_dependencies:
  melos: ^8.2.2

melos:
  command:
    bootstrap:
      runPubGetInParallel: false
  scripts:
    generate:
      description: Generate Riverpod sources for every Dart/Flutter package.
      run: melos exec --flutter --fail-fast -- "dart run build_runner build"
    format:
      description: Check Dart formatting without rewriting source.
      run: melos exec --fail-fast -- "dart format --output=none --set-exit-if-changed ."
    format:fix:
      description: Format all Dart/Flutter workspace source.
      run: melos exec --fail-fast -- "dart format ."
    analyze:
      description: Run fatal-warning analysis for every Flutter package.
      run: melos exec --flutter --fail-fast -- "dart analyze --fatal-infos --fatal-warnings"
    test:
      description: Run all Flutter package tests.
      run: melos exec --flutter --fail-fast -- "flutter test"
    package:check:
      description: Validate pub.dev payloads without publishing.
      run: melos exec --flutter --fail-fast -- "flutter pub publish --dry-run"
    examples:
      description: Run package-local Flutter examples when present.
      run: melos exec --flutter --dir-exists=example --fail-fast -- "flutter test example"
    ci:
      description: Generate, format-check, analyze, and test the Dart workspace.
      steps:
        - generate
        - format
        - analyze
        - test
