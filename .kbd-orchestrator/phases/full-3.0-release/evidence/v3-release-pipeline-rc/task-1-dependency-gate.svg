<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Prometheus 3.0 release pipeline dependency gate</title>
  <desc id="desc">Five required changes are complete, verified, and archived, unlocking the release-candidate pipeline implementation while stable publication remains locked.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#201026"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#background)"/>
  <circle cx="1260" cy="100" r="210" fill="#f97316" opacity="0.06"/>
  <circle cx="120" cy="820" r="250" fill="#e11d48" opacity="0.05"/>

  <g transform="translate(72 58)">
    <path d="M37 0 C31 26 2 31 9 61 C14 82 34 95 56 92 C82 88 95 63 86 42 C82 57 69 62 58 58 C46 53 47 41 52 29 C41 34 33 31 37 0Z" fill="url(#flame)"/>
    <text x="116" y="42" fill="#f9fafb" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="700" letter-spacing="3">PROMETHEUS</text>
    <text x="116" y="76" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="18">Entity Management · Full 3.0 release</text>
  </g>

  <text x="72" y="196" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui" font-size="48" font-weight="750">Release-candidate dependency gate</text>
  <text x="72" y="238" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="22">Every required implementation is complete, verified, and archived.</text>

  <g font-family="Inter, ui-sans-serif, system-ui" filter="url(#shadow)">
    <g transform="translate(72 292)">
      <rect width="392" height="156" rx="20" fill="#182438" stroke="#34d399" stroke-width="2"/>
      <circle cx="44" cy="44" r="20" fill="#064e3b"/>
      <path d="M34 44 l7 7 14 -16" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="39" fill="#ffffff" font-size="20" font-weight="700">Package module contracts</text>
      <text x="78" y="69" fill="#6ee7b7" font-size="15" font-weight="700">DONE · COMPLETE · ARCHIVED</text>
      <text x="28" y="113" fill="#cbd5e1" font-size="16">Tarballs, imports, declarations, metadata</text>
      <text x="28" y="137" fill="#94a3b8" font-size="14">Archive: 2026-08-01</text>
    </g>

    <g transform="translate(504 292)">
      <rect width="392" height="156" rx="20" fill="#182438" stroke="#34d399" stroke-width="2"/>
      <circle cx="44" cy="44" r="20" fill="#064e3b"/>
      <path d="M34 44 l7 7 14 -16" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
