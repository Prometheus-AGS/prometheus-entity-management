      <text x="78" y="69" fill="#6ee7b7" font-size="15" font-weight="700">DONE · COMPLETE · ARCHIVED</text>
      <text x="28" y="113" fill="#cbd5e1" font-size="16">Analyze, test, package, public API proof</text>
      <text x="28" y="137" fill="#94a3b8" font-size="14">Archive: 2026-08-02</text>
    </g>

    <g transform="translate(720 486)">
      <rect width="392" height="156" rx="20" fill="#182438" stroke="#34d399" stroke-width="2"/>
      <circle cx="44" cy="44" r="20" fill="#064e3b"/>
      <path d="M34 44 l7 7 14 -16" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
