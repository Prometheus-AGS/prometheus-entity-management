  <path d="M700 664 v46" stroke="#64748b" stroke-width="3" stroke-dasharray="7 8"/>
  <path d="M689 704 l11 14 11 -14" fill="none" stroke="#f59e0b" stroke-width="3"/>

  <g transform="translate(180 726)" font-family="Inter, ui-sans-serif, system-ui">
