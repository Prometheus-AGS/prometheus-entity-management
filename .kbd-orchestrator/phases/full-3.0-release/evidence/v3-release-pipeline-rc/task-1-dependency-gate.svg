      <text x="78" y="69" fill="#6ee7b7" font-size="15" font-weight="700">DONE · COMPLETE · ARCHIVED</text>
      <text x="28" y="113" fill="#cbd5e1" font-size="16">One compatible core across all bindings</text>
      <text x="28" y="137" fill="#94a3b8" font-size="14">Archive: 2026-08-01</text>
    </g>

