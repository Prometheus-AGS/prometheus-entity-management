name: prometheus_entity_showcase
description: >
  Prometheus 3.0 Flutter and Riverpod showcase for normalized entity graphs,
  offline CRUD, realtime relationships, and policy-gated A2UI surfaces.
publish_to: none
version: 4.0.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  entity_graph_flutter:
    path: ../../packages/entity_graph_flutter
  flutter:
    sdk: flutter
  hooks_riverpod: 3.4.3
  flutter_hooks: 0.21.3+1
  genui: 0.10.2
  riverpod_annotation: 4.0.7

dev_dependencies:
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: 4.0.9

flutter:
  uses-material-design: true
