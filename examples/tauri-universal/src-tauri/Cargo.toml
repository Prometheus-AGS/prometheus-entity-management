[package]
name = "prometheus-tauri-universal-example"
version = "0.0.0"
description = "Prometheus Entity Graph universal desktop and mobile example"
edition = "2021"
publish = false

[lib]
name = "prometheus_tauri_universal_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
entity-graph-tauri = { path = "../../../packages/entity-graph-tauri/rust-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
