[package]
name = "entity-graph-tauri"
version = "4.0.0"
edition = "2021"
description = "Tauri v2 plugin exposing entity-graph commands and events with tauri-specta v2 TypeScript binding generation."
license = "MIT"
repository = "https://github.com/prometheus-ags/prometheus-entity-management"
keywords = ["tauri", "tauri-plugin", "entity-graph", "specta"]
categories = ["gui"]
rust-version = "1.88.0"
links = "entity-graph-tauri"

[lib]
name = "entity_graph_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Enable the dedicated `generate-bindings` binary and drift checker.
generate-bindings = ["dep:tauri-specta", "dep:specta", "dep:specta-typescript", "tauri/test"]

[dependencies]
tauri = { version = "2.11.5", default-features = false }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"], optional = true }
specta = { version = "=2.0.0-rc.25", features = ["serde_json"], optional = true }
specta-typescript = { version = "=0.0.12", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }

[[bin]]
name = "generate-bindings"
path = "src/bin/generate-bindings.rs"
required-features = ["generate-bindings"]

[patch.crates-io]
urlpattern = { path = "vendor/patches/urlpattern-0.3.0" }
specta = { path = "vendor/patches/specta-2.0.0-rc.25" }

# Keep Tauri 2.11 on GTK3/WebKitGTK 4.1 with GLib 0.22.
muda = { path = "vendor/gtk3-glib/muda-0.19.3" }
tauri = { path = "vendor/gtk3-glib/tauri-2.11.5" }
tauri-runtime = { path = "vendor/gtk3-glib/tauri-runtime-2.11.3" }
webkit2gtk = { path = "vendor/gtk3-glib/webkit2gtk-2.0.2" }
webkit2gtk-sys = { path = "vendor/gtk3-glib/webkit2gtk-2.0.2/sys" }
