name: entity_graph_flutter
description: >
  Flutter/Dart mirror of the Prometheus entity graph — normalized, reactive
  entity store with generated Riverpod 3 provider families, optimistic CRUD,
  local/remote/hybrid views and pluggable transports.
version: 3.1.0
homepage: https://github.com/Prometheus-AGS/prometheus-entity-management

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # Bounded ranges retain the newest Riverpod generation line that resolves on
  # Flutter 3.44 stable. The 3.4/4.0.6 line targets the newer Flutter test
  # dependency matrix and cannot resolve against Flutter 3.44.8.
  flutter_riverpod: ">=3.3.2 <3.4.0"
  riverpod_annotation: ">=4.0.3 <4.0.5"

dev_dependencies:
  flutter_test:
    sdk: flutter
  # build_runner 2.15.2+ forces analyzer 13.3+, while Riverpod generator
  # 4.0.4 uses analyzer 12 and remains compatible with Flutter 3.44.8.
  build_runner: 2.15.1
  riverpod_generator: 4.0.4
  flutter_lints: ^6.0.0

flutter:
  # Library package — no assets or fonts needed.
