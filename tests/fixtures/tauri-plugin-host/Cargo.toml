[package]
name = "entity-graph-tauri-host-contract"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "entity_graph_tauri_host_contract_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
entity-graph-tauri = { path = "../../../packages/entity-graph-tauri/rust-plugin" }
serde_json = "1"
tauri = { version = "2.11.5", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
