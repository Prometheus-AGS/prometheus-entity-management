<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prometheus native bridge contract</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #090b11; color: #f8fafc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #3b1424, #090b11 58%); }
      main { width: min(100%, 620px); padding: 32px; border: 1px solid #334155; border-radius: 24px; background: rgba(15, 23, 42, .94); box-shadow: 0 24px 70px rgba(0, 0, 0, .42); }
      .brand { color: #ff5a67; font-size: .82rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 10px 0 12px; font-size: clamp(1.8rem, 7vw, 3rem); line-height: 1.04; }
      p { color: #cbd5e1; line-height: 1.6; }
      .receipt { margin-top: 28px; padding: 20px; border-radius: 16px; background: #020617; border: 1px solid #475569; }
      [data-contract-status] { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: #f59e0b; color: #111827; font-size: .78rem; font-weight: 900; letter-spacing: .08em; }
      [data-contract-status][data-state="passed"] { background: #34d399; }
      [data-contract-status][data-state="denied"], [data-contract-status][data-state="failed"] { background: #fb7185; }
      pre { margin: 18px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; color: #e2e8f0; font: 700 .95rem/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Prometheus AGS · 3.0 certification</div>
      <h1>Native bridge receipt</h1>
      <p>This target calls the Rust-generated entity graph binding and displays the exact Android or iOS plugin response.</p>
      <section class="receipt" aria-live="polite" aria-atomic="true">
        <span data-contract-status data-state="checking">CHECKING</span>
        <pre data-contract-response>Preparing native command…</pre>
      </section>
    </main>
    <script src="./contract.js"></script>
  </body>
</html>
