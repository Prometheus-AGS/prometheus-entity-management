name: Publish immutable release assets

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Publish an RC candidate or the coordinated stable release
        required: true
        type: choice
        options: [rc, stable]
      release_tag:
        description: Draft GitHub Release tag containing the locally certified assets
        required: true
        type: string
      candidate_sha:
        description: Exact locally certified source commit
        required: true
        type: string
      candidate_run_id:
        description: Optional prior deployment run whose immutable candidate is being reused
        required: false
        type: string

concurrency:
  group: npm-${{ inputs.channel }}-${{ inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  publish-rc:
    if: inputs.channel == 'rc'
    runs-on: ubuntu-latest
    environment: npm-rc
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      PROMETHEUS_RELEASE_AUTHORITY: stage-rc
      PROMETHEUS_RELEASE_ENVIRONMENT: npm-rc
      PROMETHEUS_RELEASE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the trusted-publishing npm client
        run: npm install --global npm@11.16.0
      - name: Download immutable locally certified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${{ inputs.release_tag }}"
          --pattern 'manifest.json' --pattern 'rehearsal.json'
          --pattern 'SHA256SUMS' --pattern '*.tgz' --dir .release-assets
      - name: Verify exact source, optional reused run, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: ./scripts/verify-deployment-assets.sh .release-assets "${{ inputs.candidate_sha }}" "$CANDIDATE_RUN_ID"
      - name: Stage RC packages without rebuilding
        run: >-
          node scripts/release-candidate.mjs stage
          --manifest .release-assets/manifest.json
          --rehearsal .release-assets/rehearsal.json
          --output .release-assets/deployment-report.json
      - name: Preserve the staging recovery journal
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: entity-management-rc-deployment-${{ inputs.candidate_sha }}
          path: .release-assets/deployment-report.json
          if-no-files-found: error
          retention-days: 30

  publish-stable:
    if: inputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment: npm-stable
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      PROMETHEUS_RELEASE_AUTHORITY: publish-stable
      PROMETHEUS_RELEASE_ENVIRONMENT: npm-stable
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the trusted-publishing npm client
        run: npm install --global npm@11.16.0
      - name: Download immutable locally certified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release download "${{ inputs.release_tag }}"
          --pattern 'manifest.json' --pattern 'rehearsal.json'
          --pattern 'SHA256SUMS' --pattern '*.tgz' --dir .release-assets
      - name: Verify exact source, optional reused run, and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: ./scripts/verify-deployment-assets.sh .release-assets "${{ inputs.candidate_sha }}" "$CANDIDATE_RUN_ID"
      - name: Publish stable packages directly without rebuilding
        run: >-
          node scripts/release-candidate.mjs stage
          --manifest .release-assets/manifest.json
          --rehearsal .release-assets/rehearsal.json
          --output .release-assets/deployment-report.json
      - name: Preserve the stable publication recovery journal
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: entity-management-stable-deployment-${{ inputs.candidate_sha }}
          path: .release-assets/deployment-report.json
          if-no-files-found: error
          retention-days: 90
