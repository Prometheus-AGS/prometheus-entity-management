name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  library-and-examples:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"

      - name: Install the pinned uv runtime
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Rust minimum-supported toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install the certified Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Fetch locked Rust dependencies for offline verification
        run: |
          cargo +stable fetch --locked \
            --manifest-path packages/entity-graph-tauri/rust-plugin/Cargo.toml
          cargo +1.88.0 fetch --locked \
            --manifest-path tests/fixtures/tauri-plugin-host/Cargo.toml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the certified Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate release contract
        run: pnpm run ci:validate

      - name: Lint
        run: pnpm run ci:lint

      - name: Typecheck (all workspaces)
        run: pnpm run ci:typecheck

      - name: Build all workspaces
        run: pnpm run ci:build

      - name: Run the full packed DevTools integration gate
        if: matrix.node == 24
        run: pnpm run ci:integration

      - name: Verify skills ↔ exports ledger
        run: pnpm run ci:skills

      - name: Audit production dependency policy
        if: matrix.node == 24
        run: pnpm run ci:security
