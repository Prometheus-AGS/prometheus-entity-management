<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prometheus Entity Graph DevTools</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      width: 100%; height: 100%;
      background: #07111f;
      color: #eaf2ff;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    .connection-state { min-height: 100%; display: grid; place-content: center; gap: .75rem; padding: 2rem; text-align: center; }
    .connection-state h1 { font-size: 1.1rem; }
    .connection-state p { color: #9fb1c9; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="panel.global.js"></script>
</body>
</html>
